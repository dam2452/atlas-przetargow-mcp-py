[project]
name = "atlas-przetargow-mcp-py"
version = "0.1.0"
description = "Atlas Przetargow Polish public procurement API MCP server"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
]

[project.scripts]
atlas-przetargow-mcp-py = "atlas_przetargow_mcp_py.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_przetargow_mcp_py"]
